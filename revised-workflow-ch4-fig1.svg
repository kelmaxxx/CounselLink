<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" font-family="Arial, Helvetica, sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
  </marker>
  <style>
    .lane-title { font-size:16px; font-weight:bold; fill:#fff; }
    .box { rx:8; ry:8; stroke-width:1.5; }
    .txt { font-size:12.5px; fill:#111; font-weight:600; }
    .sub { font-size:11px; fill:#333; font-weight:normal; }
    .dia { stroke-width:1.5; }
    .note { font-size:11.5px; fill:#444; }
  </style>
</defs>

<!-- Background -->
<rect x="0" y="0" width="1200" height="1180" fill="#ffffff" stroke="#ccc"/>

<!-- Title -->
<text x="600" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">CounselLink — Revised System Workflow (Capstone 2 — Actual Implementation)</text>
<text x="600" y="52" text-anchor="middle" font-size="12" fill="#555">Figure 1, Chapter 4: Replaces Capstone 1 proposal. 4 roles + System notifications. Testing/Survey is separate in Methodology.</text>

<!-- Lane headers -->
<rect x="10" y="65" width="285" height="36" fill="#2563EB" rx="6"/>
<rect x="305" y="65" width="285" height="36" fill="#16A34A" rx="6"/>
<rect x="600" y="65" width="285" height="36" fill="#EA580C" rx="6"/>
<rect x="895" y="65" width="295" height="36" fill="#7C3AED" rx="6"/>
<text x="152" y="88" text-anchor="middle" class="lane-title">STUDENT</text>
<text x="447" y="88" text-anchor="middle" class="lane-title">COUNSELOR</text>
<text x="742" y="88" text-anchor="middle" class="lane-title">COLLEGE REP</text>
<text x="1042" y="88" text-anchor="middle" class="lane-title">ADMIN / SYSTEM</text>

<!-- Lane backgrounds -->
<rect x="10" y="105" width="285" height="1020" fill="#EFF6FF" stroke="#BFDBFE"/>
<rect x="305" y="105" width="285" height="1020" fill="#F0FDF4" stroke="#BBF7D0"/>
<rect x="600" y="105" width="285" height="1020" fill="#FFF7ED" stroke="#FDBA74"/>
<rect x="895" y="105" width="295" height="1020" fill="#F5F3FF" stroke="#DDD6FE"/>

<!-- ===== STUDENT FLOW ===== -->
<g>
  <ellipse cx="152" cy="140" rx="55" ry="20" fill="#fff" stroke="#2563EB" stroke-width="1.5"/>
  <text x="152" y="144" text-anchor="middle" class="txt">Start</text>

  <rect x="30" y="170" width="245" height="58" class="box" fill="#fff" stroke="#2563EB"/>
  <text x="152" y="190" text-anchor="middle" class="txt">Register</text>
  <text x="152" y="206" text-anchor="middle" class="sub">MSU email OTP + COR upload</text>

  <rect x="30" y="238" width="245" height="58" class="box" fill="#FEF9C3" stroke="#CA8A04"/>
  <text x="152" y="258" text-anchor="middle" class="txt">Wait Admin Approval</text>
  <text x="152" y="274" text-anchor="middle" class="sub">pending → approved / rejected</text>

  <rect x="30" y="306" width="245" height="48" class="box" fill="#fff" stroke="#2563EB"/>
  <text x="152" y="326" text-anchor="middle" class="txt">Login</text>
  <text x="152" y="340" text-anchor="middle" class="sub">+ forgot / reset OTP</text>

  <rect x="30" y="364" width="245" height="72" class="box" fill="#fff" stroke="#2563EB"/>
  <text x="152" y="384" text-anchor="middle" class="txt">Book Appointment</text>
  <text x="152" y="400" text-anchor="middle" class="sub">Counseling / Psych Test</text>
  <text x="152" y="414" text-anchor="middle" class="sub">+ e-Sign consent + inventory</text>

  <rect x="30" y="446" width="245" height="58" class="box" fill="#fff" stroke="#2563EB"/>
  <text x="152" y="466" text-anchor="middle" class="txt">Track Status</text>
  <text x="152" y="482" text-anchor="middle" class="sub">pending / approved / resched.</text>

  <polygon points="152,514 262,554 152,594 42,554" fill="#fff" stroke="#2563EB" class="dia"/>
  <text x="152" y="551" text-anchor="middle" class="txt">Need change?</text>
  <text x="152" y="565" text-anchor="middle" class="sub">resched. / cancel</text>

  <rect x="30" y="604" width="245" height="52" class="box" fill="#fff" stroke="#2563EB"/>
  <text x="152" y="624" text-anchor="middle" class="txt">Attend Session</text>
  <text x="152" y="639" text-anchor="middle" class="sub">+ messaging with counselor</text>

  <rect x="30" y="666" width="245" height="58" class="box" fill="#fff" stroke="#2563EB"/>
  <text x="152" y="686" text-anchor="middle" class="txt">View Result / Session PDF</text>
  <text x="152" y="702" text-anchor="middle" class="sub">test result + session record</text>

  <rect x="30" y="734" width="245" height="58" class="box" fill="#fff" stroke="#2563EB"/>
  <text x="152" y="754" text-anchor="middle" class="txt">Submit Client Feedback</text>
  <text x="152" y="770" text-anchor="middle" class="sub">per-session evaluation</text>

  <ellipse cx="152" cy="822" rx="55" ry="20" fill="#fff" stroke="#2563EB" stroke-width="1.5"/>
  <text x="152" y="826" text-anchor="middle" class="txt">End</text>

  <!-- vertical arrows student -->
  <line x1="152" y1="160" x2="152" y2="170" stroke="#333" marker-end="url(#arr)"/>
  <line x1="152" y1="228" x2="152" y2="238" stroke="#333" marker-end="url(#arr)"/>
  <line x1="152" y1="296" x2="152" y2="306" stroke="#333" marker-end="url(#arr)"/>
  <line x1="152" y1="354" x2="152" y2="364" stroke="#333" marker-end="url(#arr)"/>
  <line x1="152" y1="436" x2="152" y2="446" stroke="#333" marker-end="url(#arr)"/>
  <line x1="152" y1="504" x2="152" y2="514" stroke="#333" marker-end="url(#arr)"/>
  <line x1="152" y1="594" x2="152" y2="604" stroke="#333" marker-end="url(#arr)"/>
  <line x1="152" y1="656" x2="152" y2="666" stroke="#333" marker-end="url(#arr)"/>
  <line x1="152" y1="724" x2="152" y2="734" stroke="#333" marker-end="url(#arr)"/>
  <line x1="152" y1="792" x2="152" y2="802" stroke="#333" marker-end="url(#arr)"/>
</g>

<!-- ===== COUNSELOR FLOW ===== -->
<g>
  <rect x="325" y="306" width="245" height="48" class="box" fill="#fff" stroke="#16A34A"/>
  <text x="447" y="326" text-anchor="middle" class="txt">Login</text>
  <text x="447" y="340" text-anchor="middle" class="sub">invitation acceptance</text>

  <rect x="325" y="364" width="245" height="72" class="box" fill="#fff" stroke="#16A34A"/>
  <text x="447" y="384" text-anchor="middle" class="txt">View Pending Queue</text>
  <text x="447" y="400" text-anchor="middle" class="sub">appointments / tests / referrals</text>
  <text x="447" y="414" text-anchor="middle" class="sub">+ urgent flag triage</text>

  <polygon points="447,446 557,486 447,526 337,486" fill="#FEF9C3" stroke="#CA8A04" class="dia"/>
  <text x="447" y="483" text-anchor="middle" class="txt">Decide</text>
  <text x="447" y="497" text-anchor="middle" class="sub">accept / reject / resched.</text>

  <rect x="325" y="536" width="245" height="52" class="box" fill="#fff" stroke="#16A34A"/>
  <text x="447" y="556" text-anchor="middle" class="txt">Conduct Session</text>
  <text x="447" y="571" text-anchor="middle" class="sub">+ chat + no-show sweep</text>

  <rect x="325" y="598" width="245" height="68" class="box" fill="#fff" stroke="#16A34A"/>
  <text x="447" y="618" text-anchor="middle" class="txt">Document Session</text>
  <text x="447" y="633" text-anchor="middle" class="sub">notes / upload test result</text>
  <text x="447" y="647" text-anchor="middle" class="sub">consent &amp; inventory scans</text>

  <rect x="325" y="676" width="245" height="58" class="box" fill="#FEF9C3" stroke="#CA8A04"/>
  <text x="447" y="696" text-anchor="middle" class="txt">Finalize (Lock)</text>
  <text x="447" y="712" text-anchor="middle" class="sub">follow-up / termination</text>

  <rect x="325" y="744" width="245" height="68" class="box" fill="#fff" stroke="#16A34A"/>
  <text x="447" y="764" text-anchor="middle" class="txt">Respond to Report Req.</text>
  <text x="447" y="780" text-anchor="middle" class="sub">fulfilled / declined → send PDF</text>
  <text x="447" y="794" text-anchor="middle" class="sub">view feedback tally</text>

  <line x1="447" y1="354" x2="447" y2="364" stroke="#333" marker-end="url(#arr)"/>
  <line x1="447" y1="436" x2="447" y2="446" stroke="#333" marker-end="url(#arr)"/>
  <line x1="447" y1="526" x2="447" y2="536" stroke="#333" marker-end="url(#arr)"/>
  <line x1="447" y1="588" x2="447" y2="598" stroke="#333" marker-end="url(#arr)"/>
  <line x1="447" y1="666" x2="447" y2="676" stroke="#333" marker-end="url(#arr)"/>
  <line x1="447" y1="734" x2="447" y2="744" stroke="#333" marker-end="url(#arr)"/>
</g>

<!-- ===== REP FLOW ===== -->
<g>
  <rect x="620" y="306" width="245" height="48" class="box" fill="#fff" stroke="#EA580C"/>
  <text x="742" y="326" text-anchor="middle" class="txt">Login</text>
  <text x="742" y="340" text-anchor="middle" class="sub">college-assigned account</text>

  <rect x="620" y="364" width="245" height="72" class="box" fill="#fff" stroke="#EA580C"/>
  <text x="742" y="384" text-anchor="middle" class="txt">Create Referral</text>
  <text x="742" y="400" text-anchor="middle" class="sub">direct or broadcast</text>
  <text x="742" y="414" text-anchor="middle" class="sub">+ cancel own pending</text>

  <rect x="620" y="446" width="245" height="58" class="box" fill="#fff" stroke="#EA580C"/>
  <text x="742" y="466" text-anchor="middle" class="txt">Track Referral Status</text>
  <text x="742" y="482" text-anchor="middle" class="sub">pending / accepted / rejected</text>

  <rect x="620" y="514" width="245" height="68" class="box" fill="#fff" stroke="#EA580C"/>
  <text x="742" y="534" text-anchor="middle" class="txt">Request Report</text>
  <text x="742" y="550" text-anchor="middle" class="sub">individual / college / dept.</text>
  <text x="742" y="564" text-anchor="middle" class="sub">auto letter PDF</text>

  <rect x="620" y="592" width="245" height="68" class="box" fill="#fff" stroke="#EA580C"/>
  <text x="742" y="612" text-anchor="middle" class="txt">Receive / Acknowledge</text>
  <text x="742" y="628" text-anchor="middle" class="sub">download PDF, acknowledge</text>
  <text x="742" y="642" text-anchor="middle" class="sub">view college analytics</text>

  <line x1="742" y1="354" x2="742" y2="364" stroke="#333" marker-end="url(#arr)"/>
  <line x1="742" y1="436" x2="742" y2="446" stroke="#333" marker-end="url(#arr)"/>
  <line x1="742" y1="504" x2="742" y2="514" stroke="#333" marker-end="url(#arr)"/>
  <line x1="742" y1="582" x2="742" y2="592" stroke="#333" marker-end="url(#arr)"/>
</g>

<!-- ===== ADMIN FLOW ===== -->
<g>
  <rect x="915" y="170" width="255" height="58" class="box" fill="#fff" stroke="#7C3AED"/>
  <text x="1042" y="190" text-anchor="middle" class="txt">Verify Registrations</text>
  <text x="1042" y="206" text-anchor="middle" class="sub">pending-approval queue + COR</text>

  <rect x="915" y="238" width="255" height="58" class="box" fill="#fff" stroke="#7C3AED"/>
  <text x="1042" y="258" text-anchor="middle" class="txt">Approve / Reject / Ban</text>
  <text x="1042" y="274" text-anchor="middle" class="sub">manage users by role/college</text>

  <rect x="915" y="306" width="255" height="58" class="box" fill="#fff" stroke="#7C3AED"/>
  <text x="1042" y="326" text-anchor="middle" class="txt">Provision Staff</text>
  <text x="1042" y="342" text-anchor="middle" class="sub">invite counselor / rep</text>

  <rect x="915" y="374" width="255" height="62" class="box" fill="#fff" stroke="#7C3AED"/>
  <text x="1042" y="394" text-anchor="middle" class="txt">Post Announcement</text>
  <text x="1042" y="410" text-anchor="middle" class="sub">schedule + pubmat image</text>

  <rect x="915" y="446" width="255" height="84" class="box" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="1042" y="466" text-anchor="middle" class="txt">System: Notify + Log</text>
  <text x="1042" y="482" text-anchor="middle" class="sub">notifications to all roles</text>
  <text x="1042" y="496" text-anchor="middle" class="sub">audit logs + stats / reports</text>
  <text x="1042" y="510" text-anchor="middle" class="sub">Manila server-time guard</text>

  <line x1="1042" y1="228" x2="1042" y2="238" stroke="#333" marker-end="url(#arr)"/>
  <line x1="1042" y1="296" x2="1042" y2="306" stroke="#333" marker-end="url(#arr)"/>
  <line x1="1042" y1="364" x2="1042" y2="374" stroke="#333" marker-end="url(#arr)"/>
  <line x1="1042" y1="436" x2="1042" y2="446" stroke="#333" marker-end="url(#arr)"/>
</g>

<!-- Cross-lane connections (dashed) -->
<g stroke="#555" stroke-width="1.3" stroke-dasharray="6,4" fill="none">
  <!-- Register -> Verify -->
  <path d="M 275 199 L 915 199" marker-end="url(#arr)"/>
  <!-- Approve -> Wait -->
  <path d="M 915 267 L 275 267" marker-end="url(#arr)"/>
  <!-- Book -> Queue -->
  <path d="M 275 400 L 325 400" marker-end="url(#arr)"/>
  <!-- Referral -> Queue -->
  <path d="M 620 400 L 570 400" marker-end="url(#arr)"/>
  <!-- Decide reject back to student track -->
  <path d="M 337 489 L 275 489" marker-end="url(#arr)"/>
  <!-- Finalize -> View -->
  <path d="M 325 695 L 275 695" marker-end="url(#arr)"/>
  <!-- Report request -> Counselor respond -->
  <path d="M 620 548 L 570 765" marker-end="url(#arr)"/>
  <!-- Send report -> Rep receive -->
  <path d="M 570 778 L 620 626" marker-end="url(#arr)"/>
  <!-- System notify broadcast -->
  <path d="M 915 475 L 865 475 L 865 640 L 885 640" marker-end="url(#arr)"/>
</g>

<!-- Cross labels -->
<g font-size="10" fill="#555">
  <text x="595" y="192">register</text>
  <text x="590" y="260">approve</text>
  <text x="282" y="393">books</text>
  <text x="574" y="393">refers</text>
  <text x="285" y="482">rejected</text>
  <text x="280" y="688">result ready</text>
</g>

<!-- Urgent + reschedule note -->
<rect x="10" y="862" width="1180" height="96" fill="#FFFBEB" stroke="#F59E0B" rx="6"/>
<text x="24" y="885" font-size="12.5" font-weight="bold" fill="#92400E">Cross-cutting / added vs Capstone 1 proposal:</text>
<text x="24" y="903" class="note">• Urgent walk-in (public, no login) creates urgent appointment (is_urgent=1) + placeholder user • Reschedule loop guarded by Manila server time (meta/time)</text>
<text x="24" y="921" class="note">• Consent gate: referral-sharing yes/no required before Rep can receive individual report • Messaging + Notifications for all status changes</text>
<text x="24" y="939" class="note">• Test ≠ separate module: appointment_type='psychological_test' request + test_results upload. Session must be Finalized before reportable.</text>

<!-- Footer testing note -->
<rect x="10" y="968" width="1180" height="62" fill="#F1F5F9" stroke="#94A3B8" rx="6"/>
<text x="24" y="990" font-size="12" font-weight="bold" fill="#334155">For Chapter 4 Methodology (separate figure, not part of system workflow):</text>
<text x="24" y="1008" class="note">System Evaluation Survey (public SUS form) → Tally with researcher passcode → CSV/XLSX export + Client Feedback tally. Routes: /system-evaluation, /counselor/system-evaluation.</text>

<text x="600" y="1112" text-anchor="middle" font-size="11" fill="#64748B">Source of truth: backend/routes/*.js, frontend/src/pages/student| counselor| rep| admin. Old Capstone-1 chart lacked Admin, OTP/COR, reschedule/no-show/urgent, messaging, finalize-lock, feedback.</text>
</svg>